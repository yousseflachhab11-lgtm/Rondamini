<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rondacalcul</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;padding:0;
  width:100%;height:100%;
  overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:transparent !important;
  pointer-events:none !important;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

:root{
  --text-main:#fff;
  --glass-bg:rgba(20,20,25,.55);
  --glass-border:rgba(255,255,255,.25);
  --glass-btn:rgba(255,255,255,.12);
  --glass-btn-border:rgba(255,255,255,.22);
  --rem-bg:rgba(0,0,0,.55);
  --rem-color:#fff;
}

.glass-window{
  position:fixed;
  top:0;left:0;
  width:320px;
  background:var(--glass-bg);
  backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
  border:1px solid var(--glass-border);
  border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);
  z-index:99999;
  padding:10px;
  pointer-events:auto !important;
  will-change:transform;
  transform:translate3d(0,0,0);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

@media (orientation: landscape) {
  .glass-window { width: 260px; padding: 8px; }
  .glass-cell { font-size: 18px; }
  .glass-counter { font-size: 18px; height: 34px; min-width: 48px; }
  .glass-action { height: 34px; font-size: 14px; }
  .glass-dropped { min-height: 28px; }
  .glass-chip { font-size: 13px; padding: 3px 6px; }
}

.glass-dropped{
  min-height:34px;display:flex;align-items:center;gap:5px;
  padding:4px 6px;margin-bottom:8px;background:rgba(255,255,255,.08);
  border:1px solid var(--glass-border);border-radius:10px;
  overflow-x:auto;scrollbar-width:none;
}
.glass-dropped::-webkit-scrollbar{display:none}
.glass-pin{font-size:11px;opacity:.8}
.glass-chip{
  background:var(--glass-btn);border:1px solid var(--glass-btn-border);
  padding:4px 8px;border-radius:8px;font-weight:900;font-size:15px;
  color:var(--text-main);flex-shrink:0;
}
.glass-chip.latest{
  background:rgba(255,215,0,.45);border:2px solid #ffd700;color:#ffd700;
  box-shadow:0 0 10px rgba(255,215,0,.7);font-size:14px;padding:3px 10px;
}
.glass-empty{font-size:11px;color:var(--text-main);opacity:.65;padding:0 4px}

.glass-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px;
}

.glass-cell{
  position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  background:var(--glass-btn);border:1px solid var(--glass-btn-border);border-radius:10px;
  color:var(--text-main);font-weight:900;font-size:22px;letter-spacing:-0.5px;
  cursor:pointer;transition:transform .08s,background .2s;
  -webkit-user-select:none;user-select:none;pointer-events:auto;
}
.glass-cell:active{transform:scale(.93)}
.glass-cell.c3{background:rgba(46,204,85,.35);border-color:rgba(46,204,85,.75)}
.glass-cell.c2{background:rgba(255,215,0,.3);border-color:rgba(255,215,0,.75);color:#ffd700}
.glass-cell.c1{background:rgba(230,59,59,.4);border-color:#e63b3b;color:#fff}
.glass-cell.c0{opacity:.3;cursor:not-allowed}

@keyframes glassDangerPulse{
  0%,100%{box-shadow:inset 0 0 0 rgba(230,59,59,0)}
  50%{box-shadow:inset 0 0 14px rgba(230,59,59,.9)}
}
.glass-cell.danger-pulse{animation:glassDangerPulse 1.2s infinite}

.glass-rem{
  position:absolute;bottom:3px;left:3px;min-width:15px;height:15px;
  padding:0 3px;border-radius:5px;background:var(--rem-bg);color:var(--rem-color);
  font-size:9px;font-weight:bold;line-height:15px;text-align:center;pointer-events:none;
}
.glass-cell.c3 .glass-rem{background:rgba(46,204,85,.9);color:#0a2410}
.glass-cell.c2 .glass-rem{background:rgba(255,215,0,.9);color:#3a2c00}
.glass-cell.c1 .glass-rem{background:rgba(230,59,59,.95);color:#fff}
.glass-cell.c0 .glass-rem{background:rgba(80,20,20,.8);color:#c07070}

.glass-footer{display:flex;align-items:center;gap:6px}
.glass-counter{
  flex:0 0 auto;min-width:56px;height:40px;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.5);border:1px solid var(--glass-border);border-radius:10px;
  font-size:22px;font-weight:900;color:#ffd700;letter-spacing:-1px;
}
.glass-counter.low{color:#ff4d4d;text-shadow:0 0 8px rgba(255,77,77,.7)}
.glass-counter.done{color:#00e676;text-shadow:0 0 8px rgba(0,230,118,.8)}

.glass-action{
  flex:1;height:40px;display:flex;align-items:center;justify-content:center;
  background:var(--glass-btn);border:1px solid var(--glass-btn-border);border-radius:10px;
  color:var(--text-main);font-size:16px;font-weight:900;cursor:pointer;
  transition:transform .08s,background .2s;pointer-events:auto;
}
.glass-action:active{transform:scale(.94)}
.glass-undo{flex:2}
.glass-reset{background:rgba(255,255,255,.2)}

.glass-ctrl{
  position:absolute;width:32px;height:32px;border-radius:50%;
  border:2px solid #fff;color:#fff;font-size:18px;font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:10;pointer-events:auto;
}
.glass-minus{top:-14px;left:-14px;background:rgba(230,59,59,.95)}
.glass-plus{top:-14px;right:-14px;background:rgba(46,204,85,.95)}
.glass-ctrl:active{transform:scale(.9)}

/* ⚡ زر تفعيل الـ Overlay */
.glass-overlay{
  bottom:-14px;
  left:50%;
  margin-left:-16px;
  background:rgba(59,130,246,.95);
  width:32px;
  height:32px;
  font-size:14px;
  padding:0;
}

@keyframes glassScreenFlash{
  0%{filter:brightness(1)}
  30%{filter:brightness(1.8) hue-rotate(90deg)}
  60%{filter:brightness(.7)}
  100%{filter:brightness(1)}
}
.glass-window.screen-flash{animation:glassScreenFlash .55s ease-in-out}
</style>
</head>
<body>

<div class="glass-window" id="glassWindow">
  <button class="glass-ctrl glass-minus" id="glassMinus" title="تصغير">−</button>
  <button class="glass-ctrl glass-plus" id="glassPlus" title="تكبير">+</button>
  <button class="glass-ctrl glass-overlay" id="glassOverlay" title="تفعيل Overlay" style="display:none;">🚀</button>
  <div class="glass-dropped" id="glassDropped">
    <span class="glass-pin">📌</span>
    <span class="glass-empty" id="glassEmpty">لا توجد</span>
  </div>
  <div class="glass-grid" id="glassGrid"></div>
  <div class="glass-footer">
    <div class="glass-counter" id="glassCounter">40</div>
    <button class="glass-action glass-undo" id="glassUndo">↩ تراجع</button>
    <button class="glass-action glass-reset" id="glassReset">🔄</button>
  </div>
</div>

<script>
const allNums = [1,2,3,4,5,6,7,10,11,12];

let left = JSON.parse(localStorage.getItem('ronda_mini_left')) || Object.fromEntries(allNums.map(n=>[n,4]));
allNums.forEach(n=>{ if(left[n]===undefined) left[n]=4; });
let history = JSON.parse(localStorage.getItem('ronda_mini_history')) || [];

const glassWindow  = document.getElementById('glassWindow');
const glassGrid    = document.getElementById('glassGrid');
const glassDropped = document.getElementById('glassDropped');
const glassCounter = document.getElementById('glassCounter');
const glassUndo    = document.getElementById('glassUndo');
const glassReset   = document.getElementById('glassReset');
const glassMinus   = document.getElementById('glassMinus');
const glassPlus    = document.getElementById('glassPlus');
const glassOverlay = document.getElementById('glassOverlay');

function saveData(){
  localStorage.setItem('ronda_mini_left', JSON.stringify(left));
  localStorage.setItem('ronda_mini_history', JSON.stringify(history));
}

let audioCtx = null;
function initAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function playSound(type){
  try{
    initAudio();
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='click'){
      gain.gain.setValueAtTime(.35, now);
      osc.frequency.setValueAtTime(550, now);
      osc.frequency.exponentialRampToValueAtTime(100, now+.08);
      gain.gain.exponentialRampToValueAtTime(.01, now+.08);
      osc.start(now); osc.stop(now+.08);
    } else if(type==='depleted'){
      osc.type='sawtooth';
      gain.gain.setValueAtTime(.28, now);
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(120, now+.3);
      gain.gain.exponentialRampToValueAtTime(.001, now+.35);
      osc.start(now); osc.stop(now+.35);
    } else if(type==='milestone'){
      gain.gain.setValueAtTime(.45, now);
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now+.3);
      gain.gain.exponentialRampToValueAtTime(.01, now+.3);
      osc.start(now); osc.stop(now+.3);
    }
  }catch(e){}
}

function vibrate(pattern){
  try{ if('vibrate' in navigator) navigator.vibrate(pattern); }catch(e){}
}

function triggerScreenFlash(){
  glassWindow.classList.remove('screen-flash');
  void glassWindow.offsetWidth;
  glassWindow.classList.add('screen-flash');
}

function renderDropped(){
  const lastFour = history.slice(-4);
  if(lastFour.length === 0){
    glassDropped.innerHTML = `<span class="glass-pin">📌</span><span class="glass-empty">لا توجد</span>`;
    return;
  }
  glassDropped.innerHTML = `<span class="glass-pin">📌</span>`;
  lastFour.forEach((item, idx) => {
    const chip = document.createElement('span');
    chip.className = 'glass-chip';
    chip.textContent = '#' + item.num;
    if(idx === lastFour.length - 1) chip.classList.add('latest');
    glassDropped.appendChild(chip);
  });
  glassDropped.scrollLeft = 0;
}

function renderGrid(){
  glassGrid.innerHTML = '';
  allNums.forEach(n => {
    const cell = document.createElement('div');
    cell.className = 'glass-cell c' + left[n];
    if(left[n] === 1) cell.classList.add('danger-pulse');
    if(left[n] === 0) cell.style.cursor = 'not-allowed';
    cell.innerHTML = `${n}<span class="glass-rem">${left[n]}</span>`;
    cell.onclick = (e) => { e.preventDefault(); e.stopPropagation(); initAudio(); handleTap(n); };
    glassGrid.appendChild(cell);
  });
}

function renderCounter(){
  const remaining = Object.values(left).reduce((a,b)=>a+b,0);
  glassCounter.textContent = remaining;
  glassCounter.classList.toggle('low', remaining > 0 && remaining <= 8);
  glassCounter.classList.toggle('done', remaining === 0);
}

function render(){
  renderDropped();
  renderGrid();
  renderCounter();
}

function handleTap(n){
  if(left[n] <= 0) return;
  const willBeDepleted = (left[n] === 1);
  left[n]--;
  history.push({num:n, time: Date.now()});
  saveData();
  const remaining = Object.values(left).reduce((a,b)=>a+b,0);
  if(remaining === 0){
    playSound('milestone'); vibrate([150,100,150,100,300]);
  } else if(remaining === 40 || remaining === 24 || remaining === 12){
    playSound('milestone'); vibrate([100,50,100,50,200]); triggerScreenFlash();
  } else if(willBeDepleted){
    playSound('depleted'); vibrate([80,50,80]);
  } else {
    playSound('click'); vibrate(20);
  }
  render();
}

glassUndo.onclick = (e) => {
  e.stopPropagation();
  initAudio();
  const entry = history.pop();
  if(entry !== undefined){
    left[entry.num]++;
    saveData(); playSound('click'); vibrate(20); render();
  }
};

glassReset.onclick = (e) => {
  e.stopPropagation();
  initAudio();
  left = Object.fromEntries(allNums.map(n=>[n,4]));
  history = [];
  localStorage.removeItem('ronda_mini_left');
  localStorage.removeItem('ronda_mini_history');
  playSound('milestone'); vibrate(40); triggerScreenFlash(); render();
};

/* ============================================================
   Scale + Position
   ============================================================ */
let currentX = 0, currentY = 0;
let currentScale = parseFloat(localStorage.getItem('ronda_mini_scale')) || 1;

(function(){
  const saved = JSON.parse(localStorage.getItem('ronda_mini_pos_v4'));
  if(saved && saved.xPct !== undefined){
    currentX = (saved.xPct / 100) * window.innerWidth;
    currentY = (saved.yPct / 100) * window.innerHeight;
  } else {
    currentX = Math.max(10, window.innerWidth - 340);
    currentY = 60;
  }
  clampPosition();
})();

function clampPosition(){
  const w = glassWindow.offsetWidth * currentScale;
  const h = glassWindow.offsetHeight * currentScale;
  const maxX = window.innerWidth - w;
  const maxY = window.innerHeight - h;
  currentX = Math.max(0, Math.min(maxX, currentX));
  currentY = Math.max(0, Math.min(maxY, currentY));
}

function applyTransform(){
  glassWindow.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) scale(${currentScale})`;
  glassWindow.style.transformOrigin = 'top left';
}
applyTransform();

/* ============================================================
   التحكم فالحجم
   ============================================================ */
glassPlus.onclick = (e) => {
  e.stopPropagation();
  currentScale = Math.min(2.5, currentScale + 0.1);
  localStorage.setItem('ronda_mini_scale', currentScale);
  clampPosition(); applyTransform();
  playSound('click'); vibrate(15);
};

glassMinus.onclick = (e) => {
  e.stopPropagation();
  currentScale = Math.max(0.4, currentScale - 0.1);
  localStorage.setItem('ronda_mini_scale', currentScale);
  clampPosition(); applyTransform();
  playSound('click'); vibrate(15);
};

/* ============================================================
   زر تفعيل الـ Overlay
   ============================================================ */
(function(){
  if(!glassOverlay) return;
  
  // فحص واش الـ Bridge موجود
  if(typeof AndroidOverlay !== 'undefined'){
    glassOverlay.style.display = 'flex';
  } else {
    glassOverlay.style.display = 'none';
    return;
  }
  
  glassOverlay.onclick = (e) => {
    e.stopPropagation();
    try {
      AndroidOverlay.startOverlay();
    } catch(err){
      // تجاهل
    }
    playSound('click');
    vibrate(30);
  };
})();

/* ============================================================
   السحب
   ============================================================ */
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let posStartX = 0, posStartY = 0;
let rafId = null;

function startDrag(clientX, clientY){
  isDragging = true;
  dragStartX = clientX;
  dragStartY = clientY;
  posStartX = currentX;
  posStartY = currentY;
}

function moveDrag(clientX, clientY){
  if(!isDragging) return;
  const dx = (clientX - dragStartX) / currentScale;
  const dy = (clientY - dragStartY) / currentScale;
  let x = posStartX + dx;
  let y = posStartY + dy;
  const w = glassWindow.offsetWidth * currentScale;
  const h = glassWindow.offsetHeight * currentScale;
  const maxX = window.innerWidth - w;
  const maxY = window.innerHeight - h;
  x = Math.max(0, Math.min(maxX, x));
  y = Math.max(0, Math.min(maxY, y));
  currentX = x; currentY = y;
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(applyTransform);
}

function endDrag(){
  if(!isDragging) return;
  isDragging = false;
  const xPct = (currentX / window.innerWidth) * 100;
  const yPct = (currentY / window.innerHeight) * 100;
  localStorage.setItem('ronda_mini_pos_v4', JSON.stringify({xPct, yPct}));
}

glassWindow.addEventListener('touchstart', (e) => {
  if(e.target.closest('button, .glass-cell')) return;
  const t = e.touches[0];
  startDrag(t.clientX, t.clientY);
}, {passive:true});

glassWindow.addEventListener('touchmove', (e) => {
  if(!isDragging) return;
  const t = e.touches[0];
  moveDrag(t.clientX, t.clientY);
  e.preventDefault();
}, {passive:false});

glassWindow.addEventListener('touchend', endDrag);
glassWindow.addEventListener('touchcancel', endDrag);

glassWindow.addEventListener('mousedown', (e) => {
  if(e.target.closest('button, .glass-cell')) return;
  startDrag(e.clientX, e.clientY);
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if(!isDragging) return;
  moveDrag(e.clientX, e.clientY);
});

document.addEventListener('mouseup', endDrag);

/* ============================================================
   الدوران
   ============================================================ */
function handleRotation(){
  setTimeout(() => {
    const saved = JSON.parse(localStorage.getItem('ronda_mini_pos_v4'));
    if(saved && saved.xPct !== undefined){
      currentX = (saved.xPct / 100) * window.innerWidth;
      currentY = (saved.yPct / 100) * window.innerHeight;
    }
    clampPosition();
    applyTransform();
  }, 300);
}

window.addEventListener('resize', handleRotation);
window.addEventListener('orientationchange', handleRotation);

render();
</script>
</body>
</html>
