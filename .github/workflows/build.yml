name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install

      - name: Install Capacitor CLI
        run: |
          npm install -g @capacitor/cli

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Make WebView transparent
        run: |
          FILE="android/app/src/main/res/values/styles.xml"
          if [ -f "$FILE" ]; then
            sed -i 's|<item name="android:windowBackground">.*</item>|<item name="android:windowBackground">@android:color/transparent</item>|g' "$FILE" || true
            sed -i 's|<item name="android:background">.*</item>|<item name="android:background">@android:color/transparent</item>|g' "$FILE" || true
          fi
          FILE2="android/app/src/main/java/com/ronda/mini/MainActivity.java"
          if [ -f "$FILE2" ]; then
            sed -i 's|super.onCreate(savedInstanceState);|super.onCreate(savedInstanceState);\n        getWindow().setBackgroundDrawableResource(android.R.color.transparent);\n        getBridge().getWebView().setBackgroundColor(android.graphics.Color.TRANSPARENT);|' "$FILE2" || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronda-Mini-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
